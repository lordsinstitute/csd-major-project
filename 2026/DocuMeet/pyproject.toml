[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "documeet-meetings"
version = "0.1.0"
description = "Offline Windows meeting transcription and speaker review"
requires-python = ">=3.12,<3.15"
dependencies = [
  "PySide6>=6.8,<7", "numpy>=1.26", "soundfile>=0.13",
  "imageio-ffmpeg>=0.6", "reportlab>=4.4", "huggingface_hub>=0.34",
]

[project.optional-dependencies]
models = ["moondream==2.6.1", "transformers==5.22.0", "torch==2.15.0", "torchaudio==2.11.1", "librosa==1.0.0"]
dev = ["pytest>=8", "pypdf>=5", "PyInstaller>=6"]

[project.scripts]
documeet = "gather.app:main"

[tool.setuptools.packages.find]
include = ["gather*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
